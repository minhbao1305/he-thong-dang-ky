<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Workshop 2026 — Đăng Ký Sự Kiện</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Background Decoration -->
  <div class="bg-decoration" aria-hidden="true">
    <div class="circle circle--1"></div>
    <div class="circle circle--2"></div>
  </div>

  <!-- Page Wrapper — Flexbox centering -->
  <main class="page-wrapper">

    <div class="card">

      <!-- Card Header -->
      <header class="card__header">
        <div class="badge">
          <span class="badge__dot" aria-hidden="true"></span>
          Sự kiện công nghệ 2026
        </div>
        <h1 class="card__title">AI Workshop <span class="highlight">2026</span></h1>
        <p class="card__subtitle">Đăng ký tham dự hội thảo trí tuệ nhân tạo hàng đầu Việt Nam</p>
      </header>

      <!-- Registration Form -->
      <form class="form" id="registrationForm" novalidate>

        <!-- Full Name -->
        <div class="form__group">
          <label class="form__label" for="fullName">
            Họ và tên
            <span class="required" aria-label="bắt buộc">*</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              class="form__input"
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Nguyễn Văn A"
              autocomplete="name"
              required
            />
          </div>
          <span class="form__error" id="fullName-error" role="alert"></span>
        </div>

        <!-- Email -->
        <div class="form__group">
          <label class="form__label" for="email">
            Email
            <span class="required" aria-label="bắt buộc">*</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input
              class="form__input"
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="form__error" id="email-error" role="alert"></span>
        </div>

        <!-- Phone -->
        <div class="form__group">
          <label class="form__label" for="phone">
            Số điện thoại
            <span class="required" aria-label="bắt buộc">*</span>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1
                       4.11 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 2.18h3a2 2 0 0 1 2
                       1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09
                       9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339
                       1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/>
            </svg>
            <input
              class="form__input"
              type="tel"
              id="phone"
              name="phone"
              placeholder="0901 234 567"
              autocomplete="tel"
              pattern="[0-9\s\-\+]{9,15}"
              required
            />
          </div>
          <span class="form__error" id="phone-error" role="alert"></span>
        </div>

        <!-- Ticket Type -->
        <div class="form__group">
          <label class="form__label" for="ticketType">
            Loại vé
            <span class="required" aria-label="bắt buộc">*</span>
          </label>
          <div class="input-wrapper select-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0
                       2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/>
              <path d="M13 5v2M13 17v2M13 11v2"/>
            </svg>
            <select
              class="form__input form__select"
              id="ticketType"
              name="ticketType"
              required
            >
              <option value="" disabled selected>-- Chọn loại vé --</option>
              <option value="vip">🥇 VIP — Ưu tiên & Networking</option>
              <option value="standard">🎟️ Standard — Toàn bộ phiên chính</option>
              <option value="student">🎓 Student — Dành cho sinh viên</option>
            </select>
            <svg class="select-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </div>
          <span class="form__error" id="ticketType-error" role="alert"></span>
        </div>

        <!-- Ticket Info Chips -->
        <div class="ticket-info" id="ticketInfo" aria-live="polite"></div>

        <!-- Status Message ('Đang xử lý...') -->
        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>

        <!-- Submit Button -->
        <button class="btn btn--primary" type="submit" id="submitBtn">
          <span class="btn__text">Đăng Ký Ngay</span>
          <svg class="btn__icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <!-- Card Footer -->
      <footer class="card__footer">
        <p>📅 Ngày diễn ra: <strong>15 – 16 tháng 3, 2026</strong></p>
        <p>📍 Địa điểm: <strong>Trung tâm Hội nghị GEM, TP. HCM</strong></p>
      </footer>

    </div>

  </main>

  <!-- Success Toast -->
  <div class="toast" id="successToast" role="status" aria-live="polite" aria-atomic="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <path d="m9 11 3 3L22 4"/>
    </svg>
    <span>🎉 Chúc mừng bạn đã đăng ký thành công tham dự AI Workshop 2026!</span>
  </div>

  <!-- JavaScript Validation Logic -->
  <script src="script.js"></script>

</body>
</html>
